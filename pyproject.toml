[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlock"
version = "0.2.0"
description = "package-lock.json for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Akash Nath" }]
keywords = ["ai-agents", "testing", "regression", "llm", "gemma", "ollama", "contracts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.30"]
dev = ["pytest>=8", "google-genai>=1.30"]

[project.scripts]
agentlock = "agentlock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
